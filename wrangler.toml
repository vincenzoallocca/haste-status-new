name = "haste-status"
main = "dist/_worker.js"
compatibility_date = "2025-11-17"
compatibility_flags = ["nodejs_compat"]

# Custom domain configuration for haste.it
routes = [
  { pattern = "status.haste.it", custom_domain = true }
]

# Workers Static Assets
[assets]
directory = "dist"
binding = "ASSETS"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "haste-status-db"
database_id = "413dd6a3-7ff0-4564-a78e-cc8070b45b81"
migrations_dir = "migrations"

# Cron triggers
# - Single trigger: health checks every minute, daily cleanup at 03:00 UTC (idempotent)
[triggers]
crons = ["*/1 * * * *"]

# Environment variables
[vars]
ENVIRONMENT = "production"

# Tracking IDs (set via `wrangler secret put`):
# VITE_GA4_ID = "G-XXXXXXXXXX"        # Google Analytics 4 Measurement ID
# VITE_CLARITY_ID = "xxxxxxxxxx"       # Microsoft Clarity Project ID
# VITE_META_PIXEL_ID = "xxxxxxxxxxxxx" # Meta Pixel (Facebook) ID